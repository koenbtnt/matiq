<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>matiq — Knee cut pass</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&amp;family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
button{font-family:inherit;cursor:pointer}
input::placeholder,textarea::placeholder{color:#8A8F97}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: {{tk.bgBase}}; color: {{tk.text1}}; font-family: Inter, system-ui, sans-serif">

  <div style="height: 290px; background: {{tk.bgRaised}}; position: relative; display: flex; align-items: center; justify-content: center">
    <div aria-hidden="true" style="position: absolute; inset: 0; display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); opacity: 0.35">
      <div style="border-right: 1px solid {{tk.border}}"></div><div style="border-right: 1px solid {{tk.border}}"></div><div style="border-right: 1px solid {{tk.border}}"></div><div style="border-right: 1px solid {{tk.border}}"></div><div style="border-right: 1px solid {{tk.border}}"></div><div></div>
    </div>
    <button type="button" aria-label="Play instructional, 4 minutes 12 seconds" style="position: relative; width: 72px; height: 72px; border-radius: 36px; border: 0; background: {{tk.accent}}; color: {{tk.onAccent}}; display: flex; align-items: center; justify-content: center; padding: 0 0 0 4px">
      <svg width="30" height="30" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5v14l11-7z"></path></svg>
    </button>
    <span style="position: absolute; left: 20px; bottom: 16px; font-size: 12px; color: {{tk.text2}}">[Instructional video]</span>
    <span style="position: absolute; right: 16px; bottom: 14px; height: 24px; padding: 0 8px; border-radius: 6px; background: rgba(11,12,14,0.8); color: #FFFFFF; display: inline-flex; align-items: center; font-size: 12px; font-weight: 600; font-variant-numeric: tabular-nums">4:12</span>
    <a href="{{nav.library}}" aria-label="Back to library" style="position: absolute; left: 16px; top: 56px; width: 44px; height: 44px; border-radius: 22px; background: rgba(11,12,14,0.72); color: #FFFFFF; display: flex; align-items: center; justify-content: center">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg>
    </a>
  </div>

  <div style="padding: 20px 20px 0; display: flex; flex-direction: column; gap: 14px">
    <div style="display: flex; flex-direction: column; gap: 6px">
      <span style="font-size: 11px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: {{tk.text2}}">Half guard → Passing</span>
      <h1 style="margin: 0; font-family: Archivo, sans-serif; font-stretch: 115%; font-weight: 800; font-size: 28px; line-height: 32px; letter-spacing: -0.01em">Knee Cut Pass</h1>
    </div>
    <div style="display: flex; gap: 6px; flex-wrap: wrap">
      <span style="height: 28px; padding: 0 10px; border-radius: 8px; background: {{tk.bgRaised}}; display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 500"><span style="width: 14px; height: 6px; border-radius: 2px; background: #2E62F0"></span>Blue belt</span>
      <span style="height: 28px; padding: 0 10px; border-radius: 8px; background: {{tk.bgRaised}}; display: inline-flex; align-items: center; font-size: 13px; font-weight: 500">Gi &amp; No-Gi</span>
      <span style="height: 28px; padding: 0 10px; border-radius: 8px; background: {{tk.bgRaised}}; display: inline-flex; align-items: center; font-size: 13px; font-weight: 500">Top game</span>
    </div>

    <div role="tablist" style="display: flex; border-bottom: 1px solid {{tk.border}}">
      <sc-for list="{{tabs}}" as="t" hint-placeholder-count="3">
        <button type="button" role="tab" aria-selected="{{t.on}}" onClick="{{t.pick}}" style="flex: 1; height: 44px; border: 0; background: transparent; color: {{t.fg}}; font-size: 15px; font-weight: 600; box-shadow: inset 0 -2px 0 {{t.line}}">{{t.label}}</button>
      </sc-for>
    </div>

    <ol style="margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 14px">
      <sc-for list="{{items}}" as="s" hint-placeholder-count="4">
        <li style="display: flex; gap: 14px; align-items: flex-start">
          <span style="width: 28px; height: 28px; border-radius: 14px; background: {{tk.bgRaised}}; flex: none; display: flex; align-items: center; justify-content: center; font-family: Archivo, sans-serif; font-weight: 800; font-size: 13px; color: {{tk.accentText}}">{{s.n}}</span>
          <div style="display: flex; flex-direction: column; gap: 2px">
            <span style="font-size: 15px; font-weight: 600; line-height: 20px">{{s.title}}</span>
            <span style="font-size: 14px; line-height: 20px; color: {{tk.text2}}">{{s.body}}</span>
          </div>
        </li>
      </sc-for>
    </ol>
  </div>

  <div style="position: absolute; left: 0; right: 0; bottom: 0; padding: 12px 20px 34px; background: {{tk.bgSurface}}; border-top: 1px solid {{tk.border}}; display: flex; gap: 10px; align-items: center">
    <button type="button" aria-label="Save to plan" style="width: 56px; height: 56px; flex: none; border-radius: 28px; border: 1px solid {{tk.border}}; background: {{tk.bgRaised}}; color: {{tk.text1}}; display: flex; align-items: center; justify-content: center; padding: 0">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3h12v18l-6-4-6 4z"></path></svg>
    </button>
    <button type="button" onClick="{{toggleDrilled}}" aria-pressed="{{drilled}}" style="flex: 1; height: 56px; border-radius: 28px; border: 1px solid {{ctaBorder}}; background: {{ctaBg}}; color: {{ctaFg}}; font-size: 17px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 8px">
      <sc-if value="{{drilled}}" hint-placeholder-val="{{ false }}">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7"></path></svg>
      </sc-if>{{ctaLabel}}</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"enum","options":["green","blue","orange","teal","gold","mono","volt"],"default":"green"},"theme":{"editor":"enum","options":["dark","light"],"default":"dark"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { tab: 'Steps', drilled: false };
  }
  palette(theme, accent) {
    const N = {
      dark: { bgBase: '#0B0C0E', bgSurface: '#15171A', bgRaised: '#1E2125', border: '#2A2E33', borderStrong: '#3A3F45', borderStronger: '#4A4F56', text1: '#F4F4F1', text2: '#A3A8B0', text3: '#6A6F77', invBg: '#F4F4F1', invFg: '#0B0C0E', danger: '#FF5C7A', dangerTint: 'rgba(255,92,122,0.14)', warning: '#FFB547', warningTint: 'rgba(255,181,71,0.16)', info: '#6FA8FF', infoTint: 'rgba(111,168,255,0.16)', tabbar: 'rgba(21,23,26,0.96)', scrim: '#000000' },
      light: { bgBase: '#F6F6F3', bgSurface: '#FFFFFF', bgRaised: '#EEEEEA', border: '#DCDCD6', borderStrong: '#C9C9C2', borderStronger: '#A9AAA3', text1: '#0B0C0E', text2: '#5A5F67', text3: '#9A9EA4', invBg: '#15171A', invFg: '#F6F6F3', danger: '#C4223F', dangerTint: '#FCE3E8', warning: '#8F5600', warningTint: '#FCEBD2', info: '#1F5BD1', infoTint: '#E2EBFC', tabbar: 'rgba(255,255,255,0.96)', scrim: '#B9B9B4' }
    };
    const A = {
      green: { name: 'Emerald', brand: '#2EDB7F',
        dark: { accent: '#2EDB7F', onAccent: '#0B0C0E', accentText: '#5FE69C', accentBorder: '#2EDB7F', accentGraphic: '#2EDB7F', accentTint: 'rgba(46,219,127,0.16)' },
        light: { accent: '#2EDB7F', onAccent: '#0B0C0E', accentText: '#0B7A3E', accentBorder: '#17B061', accentGraphic: '#17B061', accentTint: '#DCF8E8' } },
      blue: { name: 'Azure', brand: '#3BA3FF',
        dark: { accent: '#3BA3FF', onAccent: '#0B0C0E', accentText: '#6CBBFF', accentBorder: '#3BA3FF', accentGraphic: '#3BA3FF', accentTint: 'rgba(59,163,255,0.16)', info: '#B4BAC4', infoTint: 'rgba(180,186,196,0.14)' },
        light: { accent: '#3BA3FF', onAccent: '#0B0C0E', accentText: '#0A5BB5', accentBorder: '#1E86EB', accentGraphic: '#1E86EB', accentTint: '#DFEFFF', info: '#4A5059', infoTint: '#E8E9EC' } },
      orange: { name: 'Signal Orange', brand: '#FF6A2B',
        dark: { accent: '#FF6A2B', onAccent: '#0B0C0E', accentText: '#FF8A57', accentBorder: '#FF6A2B', accentGraphic: '#FF6A2B', accentTint: 'rgba(255,106,43,0.16)' },
        light: { accent: '#FF6A2B', onAccent: '#0B0C0E', accentText: '#B23D0B', accentBorder: '#E2551A', accentGraphic: '#E2551A', accentTint: '#FFE8DD' } },
      teal: { name: 'Mat Teal', brand: '#2DD4BF',
        dark: { accent: '#2DD4BF', onAccent: '#0B0C0E', accentText: '#5EE6D3', accentBorder: '#2DD4BF', accentGraphic: '#2DD4BF', accentTint: 'rgba(45,212,191,0.16)' },
        light: { accent: '#2DD4BF', onAccent: '#0B0C0E', accentText: '#0B6E62', accentBorder: '#129C8A', accentGraphic: '#129C8A', accentTint: '#DDF6F2' } },
      gold: { name: 'Champion Gold', brand: '#FFC53D',
        dark: { accent: '#FFC53D', onAccent: '#0B0C0E', accentText: '#FFD36B', accentBorder: '#FFC53D', accentGraphic: '#FFC53D', accentTint: 'rgba(255,197,61,0.16)' },
        light: { accent: '#FFC53D', onAccent: '#0B0C0E', accentText: '#7A5000', accentBorder: '#C98A00', accentGraphic: '#B07800', accentTint: '#FFF1CC' } },
      mono: { name: 'Monochrome', brand: '#F4F4F1',
        dark: { accent: '#F4F4F1', onAccent: '#0B0C0E', accentText: '#F4F4F1', accentBorder: '#F4F4F1', accentGraphic: '#F4F4F1', accentTint: '#2A2E33' },
        light: { accent: '#0B0C0E', onAccent: '#F6F6F3', accentText: '#0B0C0E', accentBorder: '#0B0C0E', accentGraphic: '#0B0C0E', accentTint: '#E4E4DF' } },
      volt: { name: 'Volt', brand: '#D6FF3D',
        dark: { accent: '#D6FF3D', onAccent: '#0B0C0E', accentText: '#D6FF3D', accentBorder: '#D6FF3D', accentGraphic: '#D6FF3D', accentTint: 'rgba(214,255,61,0.14)' },
        light: { accent: '#0B0C0E', onAccent: '#D6FF3D', accentText: '#4A6300', accentBorder: '#8DB000', accentGraphic: '#6E8F00', accentTint: '#EDF7CF' } }
    };
    const t = theme === 'light' ? 'light' : 'dark';
    const a = A[accent] || A.green;
    return Object.assign({ theme: t, accentName: a.name, brand: a.brand }, N[t], a[t]);
  }
  renderVals() {
    const theme = this.props.theme ?? 'dark';
    const tk = this.palette(theme, this.props.accent ?? 'green');
    const sfx = theme === 'light' ? 'Light' : '';
    const { tab, drilled } = this.state;
    const content = {
      Steps: [
        { n: 1, title: 'Pin the far hip', body: 'Post your hand on the far hip so they cannot square up or follow you.' },
        { n: 2, title: 'Slice the knee across', body: 'Drive your knee over their thigh toward the mat, toes pointed out.' },
        { n: 3, title: 'Win the underhook', body: 'Underhook the far arm or crossface before you commit your weight.' },
        { n: 4, title: 'Clear and settle', body: 'Free the trailing leg and settle into side control, hips low.' }
      ],
      Details: [
        { n: '!', title: 'Head position', body: 'Keep your head on the inside of their shoulder line.' },
        { n: '!', title: 'Common counter', body: 'They recover the knee shield: switch to a backstep or leg drag.' }
      ],
      Notes: [
        { n: '·', title: 'Coach note', body: '[Your coach adds notes here after class.]' },
        { n: '·', title: 'My note', body: 'Kept getting stuck on the knee shield — pin the hip earlier.' }
      ]
    };
    return {
      theme,
      tk,
      nav: { home: `Home${sfx}.dc.html`, library: `Library${sfx}.dc.html`, log: `LogSession${sfx}.dc.html`, progress: `Progress${sfx}.dc.html`, technique: `Technique${sfx}.dc.html` },
      tabs: ['Steps', 'Details', 'Notes'].map((label) => ({
        label,
        on: tab === label,
        fg: tab === label ? tk.text1 : tk.text2,
        line: tab === label ? tk.accentGraphic : 'transparent',
        pick: () => this.setState({ tab: label })
      })),
      items: content[tab],
      drilled,
      toggleDrilled: () => this.setState({ drilled: !drilled }),
      ctaLabel: drilled ? 'Drilled today' : 'Mark as drilled',
      ctaBg: drilled ? tk.accentTint : tk.accent,
      ctaFg: drilled ? tk.accentText : tk.onAccent,
      ctaBorder: drilled ? tk.accentBorder : tk.accent
    };
  }
}
</script>
</body>
</html>
