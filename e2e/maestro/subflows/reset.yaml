# Shared subflow (outside the flows/** glob, never run alone): clean app state + reseeded DB.
# design §4.2.3 / plan F-25: dev route matiq://dev/reset, __DEV__ only.
appId: nl.btnt.matiq
---
- launchApp:
    clearState: true
    stopApp: true
- extendedWaitUntil:
    visible:
      id: "home.screen"
    timeout: 60000
- openLink: matiq://dev/reset
# home.screen stays mounted under the reset route, so wait for the reset itself first:
# progress shown, then gone (router.replace('/') on success, design §4.2.3)
- extendedWaitUntil:
    visible:
      id: "dev.reset.status"
    timeout: 30000
- extendedWaitUntil:
    notVisible:
      id: "dev.reset.status"
    timeout: 60000
- extendedWaitUntil:
    visible:
      id: "home.screen"
    timeout: 60000
- assertNotVisible:
    id: "bootstrap.error"
